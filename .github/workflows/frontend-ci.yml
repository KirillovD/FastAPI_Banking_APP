name: Frontend CI

on:
  pull_request:
    branches:
      - portfolio-v2
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - portfolio-v2
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: TypeScript + Vite + browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for browser checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser regression checks
        working-directory: frontend
        run: npm run test:ui

      - name: Preserve browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
